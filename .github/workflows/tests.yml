name: Lab Fabric Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: |
          cd ingester
          go test ./...

      - name: Run Go benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkInputLineProcessing -benchmem -count=5 | tee benchmark.txt
          {
            echo "## Go Benchmark"
            echo
            echo '```text'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run throughput benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkThroughput -benchmem -count=5 | tee throughput.txt
          {
            echo "## Throughput Benchmark"
            echo
            echo '```text'
            cat throughput.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run buffered reader benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkBufferedReader -benchmem -count=5 | tee reader.txt
          {
            echo "## Buffered Reader Benchmark"
            echo
            echo '```text'
            cat reader.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run scanner-only benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkScannerOnly -benchmem -count=5 | tee scanner.txt
          {
            echo "## Scanner Only Benchmark"
            echo
            echo '```text'
            cat scanner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Python tests
        run: python run_tests.py

      - name: Run full Go to Python JSON pipeline test
        run: python test_full_pipeline.py

      - name: Run full Go to Python syslog pipeline test
        run: python test_full_syslog_pipeline.py

      - name: Run malformed input pipeline test
        run: python test_malformed_pipeline.py

      - name: Run empty input pipeline test
        run: python test_empty_pipeline.py

      - name: Run whitespace input pipeline test
        run: python test_whitespace_pipeline.py
