name: Lab Fabric Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: |
          cd ingester
          go test ./...

      - name: Run Go benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkInputLineProcessing -benchmem -count=5 | tee benchmark.txt
          {
            echo "## Go Benchmark"
            echo
            echo '```text'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run throughput benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkThroughput -benchmem -count=5 | tee throughput.txt
          {
            echo "## Throughput Benchmark"
            echo
            echo '```text'
            cat throughput.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run lines per second benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkLinesPerSecond -benchmem -count=5 | tee lines-per-second.txt
          {
            echo "## Lines Per Second Benchmark"
            echo
            echo '```text'
            cat lines-per-second.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run buffered reader benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkBufferedReader -benchmem -count=5 | tee reader.txt
          {
            echo "## Buffered Reader Benchmark"
            echo
            echo '```text'
            cat reader.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run scanner-only benchmark
        run: |
          cd ingester
          go test -bench=BenchmarkScannerOnly -benchmem -count=5 | tee scanner.txt
          {
            echo "## Scanner Only Benchmark"
            echo
            echo '```text'
            cat scanner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build ingester
        run: |
          cd ingester
          go build -o labfabric-ingester .

      - name: Run real executable throughput benchmark
        shell: bash
        run: |
          set -euo pipefail

          cd ingester

          lines=1000000
          input_file="$(mktemp)"
          output_file="$(mktemp)"

          trap 'rm -f "$input_file" "$output_file"' EXIT

          python - <<'PY' > "$input_file"
          lines = 1_000_000
          event = b"event test data\n"

          with open("/dev/stdout", "wb") as out:
              chunk = event * 10000
              for _ in range(lines // 10000):
                  out.write(chunk)
          PY

          start_ns=$(date +%s%N)

          ./labfabric-ingester < "$input_file" > "$output_file"

          end_ns=$(date +%s%N)

          elapsed_ns=$((end_ns - start_ns))

          if [ "$elapsed_ns" -le 0 ]; then
            echo "Benchmark failed: non-positive elapsed time"
            exit 1
          fi

          output_lines=$(wc -l < "$output_file")
          output_lines=$(echo "$output_lines" | tr -d ' ')

          if [ "$output_lines" -ne "$lines" ]; then
            echo "Benchmark failed: output contained $output_lines lines, expected $lines"
            exit 1
          fi

          lines_per_sec=$(awk -v lines="$lines" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", lines / (ns / 1000000000) }')

          mb_per_sec=$(awk -v bytes="$(stat -c%s "$input_file")" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", bytes / (ns / 1000000000) / 1000000 }')

          echo "## Real Executable Throughput"
          echo
          echo "- Input lines: $lines"
          echo "- Input bytes: $(stat -c%s "$input_file")"
          echo "- Output lines verified: $output_lines"
          echo "- Elapsed: ${elapsed_ns} ns"
          echo "- **Lines/sec: $lines_per_sec**"
          echo "- MB/sec: $mb_per_sec"

          {
            echo "## Real Executable Throughput"
            echo
            echo '```text'
            echo "Input lines: $lines"
            echo "Input bytes: $(stat -c%s "$input_file")"
            echo "Output lines verified: $output_lines"
            echo "Elapsed: ${elapsed_ns} ns"
            echo "Lines/sec: $lines_per_sec"
            echo "MB/sec: $mb_per_sec"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Python tests
        run: python run_tests.py

      - name: Run full Go to Python JSON pipeline test
        run: python test_full_pipeline.py

      - name: Run full Go to Python syslog pipeline test
        run: python test_full_syslog_pipeline.py

      - name: Run malformed input pipeline test
        run: python test_malformed_pipeline.py

      - name: Run empty input pipeline test
        run: python test_empty_pipeline.py

      - name: Run whitespace input pipeline test
        run: python test_whitespace_pipeline.py

      - name: Run end-to-end Go to Python throughput benchmark
        shell: bash
        run: |
          set -euo pipefail

          lines=1000000
          input_file="$(mktemp)"
          ingester_output="$(mktemp)"
          detector_output="$(mktemp)"

          trap 'rm -f "$input_file" "$ingester_output" "$detector_output"' EXIT

          python - <<'PY' > "$input_file"
          import json

          lines = 1_000_000

          with open("/dev/stdout", "w", encoding="utf-8") as out:
              for i in range(lines):
                  event = {
                      "level": "INFO",
                      "message": "event test data",
                      "sequence": i,
                  }
                  out.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

          cd ingester
          go build -o labfabric-ingester .
          cd ..

          start_ns=$(date +%s%N)

          ./ingester/labfabric-ingester < "$input_file" > "$ingester_output"
          python detector/detector.py < "$ingester_output" > "$detector_output"

          end_ns=$(date +%s%N)

          elapsed_ns=$((end_ns - start_ns))

          if [ "$elapsed_ns" -le 0 ]; then
            echo "End-to-end benchmark failed: non-positive elapsed time"
            exit 1
          fi

          input_lines=$(wc -l < "$input_file")
          input_lines=$(echo "$input_lines" | tr -d ' ')

          ingester_lines=$(wc -l < "$ingester_output")
          ingester_lines=$(echo "$ingester_lines" | tr -d ' ')

          if [ "$input_lines" -ne "$lines" ]; then
            echo "End-to-end benchmark failed: input contained $input_lines lines, expected $lines"
            exit 1
          fi

          if [ "$ingester_lines" -ne "$lines" ]; then
            echo "End-to-end benchmark failed: ingester output contained $ingester_lines lines, expected $lines"
            exit 1
          fi

          detector_lines=$(wc -l < "$detector_output")
          detector_lines=$(echo "$detector_lines" | tr -d ' ')

          if [ "$detector_lines" -ne 0 ]; then
            echo "End-to-end benchmark failed: INFO fixture produced $detector_lines anomaly lines, expected 0"
            exit 1
          fi

          lines_per_sec=$(awk -v lines="$lines" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", lines / (ns / 1000000000) }')

          mb_per_sec=$(awk -v bytes="$(stat -c%s "$input_file")" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", bytes / (ns / 1000000000) / 1000000 }')

          echo "## End-to-End Go → Python Throughput"
          echo
          echo "- Input lines: $input_lines"
          echo "- Input bytes: $(stat -c%s "$input_file")"
          echo "- Ingester output lines verified: $ingester_lines"
          echo "- Detector anomaly lines verified: $detector_lines"
          echo "- Elapsed: ${elapsed_ns} ns"
          echo "- **Lines/sec: $lines_per_sec**"
          echo "- MB/sec: $mb_per_sec"

          {
            echo "## End-to-End Go → Python Throughput"
            echo
            echo '```text'
            echo "Input lines: $input_lines"
            echo "Input bytes: $(stat -c%s "$input_file")"
            echo "Ingester output lines verified: $ingester_lines"
            echo "Detector anomaly lines verified: $detector_lines"
            echo "Elapsed: ${elapsed_ns} ns"
            echo "Lines/sec: $lines_per_sec"
            echo "MB/sec: $mb_per_sec"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Python detector-only throughput benchmark
        shell: bash
        run: |
          set -euo pipefail

          lines=1000000
          input_file="$(mktemp)"
          output_file="$(mktemp)"

          trap 'rm -f "$input_file" "$output_file"' EXIT

          python - <<'PY' > "$input_file"
          import json

          lines = 1_000_000

          with open("/dev/stdout", "w", encoding="utf-8") as out:
              for i in range(lines):
                  event = {
                      "level": "INFO",
                      "message": "event test data",
                      "sequence": i,
                  }
                  out.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

          start_ns=$(date +%s%N)

          python detector/detector.py < "$input_file" > "$output_file"

          end_ns=$(date +%s%N)

          elapsed_ns=$((end_ns - start_ns))

          if [ "$elapsed_ns" -le 0 ]; then
            echo "Detector benchmark failed: non-positive elapsed time"
            exit 1
          fi

          input_lines=$(wc -l < "$input_file")
          input_lines=$(echo "$input_lines" | tr -d ' ')

          output_lines=$(wc -l < "$output_file")
          output_lines=$(echo "$output_lines" | tr -d ' ')

          if [ "$input_lines" -ne "$lines" ]; then
            echo "Detector benchmark failed: input contained $input_lines lines, expected $lines"
            exit 1
          fi

          if [ "$output_lines" -ne 0 ]; then
            echo "Detector benchmark failed: INFO input produced $output_lines anomaly lines, expected 0"
            exit 1
          fi

          lines_per_sec=$(awk -v lines="$lines" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", lines / (ns / 1000000000) }')

          mb_per_sec=$(awk -v bytes="$(stat -c%s "$input_file")" -v ns="$elapsed_ns" \
            'BEGIN { printf "%.2f", bytes / (ns / 1000000000) / 1000000 }')

          echo "## Python Detector-Only Throughput"
          echo
          echo "- Input lines: $input_lines"
          echo "- Input bytes: $(stat -c%s "$input_file")"
          echo "- Anomaly lines verified: $output_lines"
          echo "- Elapsed: ${elapsed_ns} ns"
          echo "- **Lines/sec: $lines_per_sec**"
          echo "- MB/sec: $mb_per_sec"

          {
            echo "## Python Detector-Only Throughput"
            echo
            echo '```text'
            echo "Input lines: $input_lines"
            echo "Input bytes: $(stat -c%s "$input_file")"
            echo "Anomaly lines verified: $output_lines"
            echo "Elapsed: ${elapsed_ns} ns"
            echo "Lines/sec: $lines_per_sec"
            echo "MB/sec: $mb_per_sec"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
